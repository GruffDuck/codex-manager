<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Account switching lifecycle</title><desc id="desc">Manual and automatic triggers share preflight, graceful close, auth write, reopen and startup checks, with recovery attempts on failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1598" height="798" rx="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="64" y="65" font-size="16" fill="#1769d2" font-weight="700">ACCOUNT SWITCHING</text><text x="64" y="116" font-size="36" fill="#0f172a" font-weight="600">One controlled lifecycle. Two ways to start.</text><text x="64" y="153" font-size="22" fill="#64748b" font-weight="400">Manual account selection and the quota policy use the same restart controller.</text><rect x="64" y="200" width="465" height="80" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="88" y="234" font-size="23" fill="#0f172a" font-weight="600">Manual switch</text><text x="88" y="260" font-size="18" fill="#64748b" font-weight="400">Choose a saved account in Manager.</text><rect x="569" y="200" width="465" height="80" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="593" y="234" font-size="23" fill="#0f172a" font-weight="600">Automatic switch</text><text x="593" y="260" font-size="18" fill="#64748b" font-weight="400">At the configured threshold, with a usable alternative.</text><text x="1090" y="233" font-size="20" fill="#334155" font-weight="600">macOS lifecycle helper</text><text x="1090" y="261" font-size="18" fill="#64748b" font-weight="400">Normal quit · no force quit</text><path d="M 297 280 V 320 H 164 V 350" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 801 280 V 320 H 164 V 350" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="64" y="350" width="272" height="178" rx="20" fill="#ffffff" stroke="#dce3ed"/><circle cx="100" cy="386" r="20" fill="#e8f1ff"/><text x="94" y="393" font-size="20" fill="#1769d2" font-weight="600">1</text><text x="88" y="437" font-size="25" fill="#0f172a" font-weight="600">Preflight</text><text x="88" y="476" font-size="18" fill="#64748b" font-weight="400">Check tokens</text><text x="88" y="502" font-size="18" fill="#64748b" font-weight="400">and installation</text><path d="M 336 439 H 362" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="362" y="350" width="272" height="178" rx="20" fill="#ffffff" stroke="#dce3ed"/><circle cx="398" cy="386" r="20" fill="#e8f1ff"/><text x="392" y="393" font-size="20" fill="#1769d2" font-weight="600">2</text><text x="386" y="437" font-size="25" fill="#0f172a" font-weight="600">Close Codex</text><text x="386" y="476" font-size="18" fill="#64748b" font-weight="400">Request normal quit;</text><text x="386" y="502" font-size="18" fill="#64748b" font-weight="400">wait for child processes</text><path d="M 634 439 H 660" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="660" y="350" width="272" height="178" rx="20" fill="#ffffff" stroke="#dce3ed"/><circle cx="696" cy="386" r="20" fill="#e8f1ff"/><text x="690" y="393" font-size="20" fill="#1769d2" font-weight="600">3</text><text x="684" y="437" font-size="25" fill="#0f172a" font-weight="600">Save login</text><text x="684" y="476" font-size="18" fill="#64748b" font-weight="400">Snapshot previous files;</text><text x="684" y="502" font-size="18" fill="#64748b" font-weight="400">write selected auth</text><path d="M 932 439 H 958" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="958" y="350" width="272" height="178" rx="20" fill="#ffffff" stroke="#dce3ed"/><circle cx="994" cy="386" r="20" fill="#e8f1ff"/><text x="988" y="393" font-size="20" fill="#1769d2" font-weight="600">4</text><text x="982" y="437" font-size="25" fill="#0f172a" font-weight="600">Reopen</text><text x="982" y="476" font-size="18" fill="#64748b" font-weight="400">Launch with the</text><text x="982" y="502" font-size="18" fill="#64748b" font-weight="400">same Codex home</text><path d="M 1230 439 H 1256" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1256" y="350" width="272" height="178" rx="20" fill="#ffffff" stroke="#dce3ed"/><circle cx="1292" cy="386" r="20" fill="#e8f1ff"/><text x="1286" y="393" font-size="20" fill="#1769d2" font-weight="600">5</text><text x="1280" y="437" font-size="25" fill="#0f172a" font-weight="600">Check startup</text><text x="1280" y="476" font-size="18" fill="#64748b" font-weight="400">Process stays running;</text><text x="1280" y="502" font-size="18" fill="#64748b" font-weight="400">auth file stays selected</text><path d="M 796 528 V 569 M 1392 528 V 569 H 655" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7"/><path d="M 655 569 V 600" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="64" y="600" width="1472" height="110" rx="20" fill="#fffaf0" stroke="#eadbb9"/><text x="88" y="638" font-size="22" fill="#8a5416" font-weight="600">If writing, launch or startup checks fail</text><text x="88" y="674" font-size="21" fill="#72552d" font-weight="400">Attempt recovery: restore the previous files and reopen the previous login when Codex was originally running.</text><text x="64" y="759" font-size="19" fill="#64748b" font-weight="400">Verification covers the process and auth file. It does not independently read Codex’s displayed account or resume replies.</text></g></svg>
