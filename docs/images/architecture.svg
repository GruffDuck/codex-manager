<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Codex Manager architecture</title><desc id="desc">The Electron UI and optional gateway clients use a local Node core, encrypted storage, the upstream service, and a macOS lifecycle helper.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1598" height="1098" rx="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="64" y="65" font-size="16" fill="#1769d2" font-weight="700">SYSTEM ARCHITECTURE</text><text x="64" y="116" font-size="36" fill="#0f172a" font-weight="600">Local control, optional request routing.</text><text x="64" y="153" font-size="22" fill="#64748b" font-weight="400">Account switching and gateway selection serve different purposes.</text><rect x="42" y="195" width="1056" height="608" rx="22" fill="#eef3f9" stroke="#dce3ed"/><text x="66" y="231" font-size="15" fill="#64748b" font-weight="700">YOUR COMPUTER</text><rect x="64" y="266" width="330" height="165" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="90" y="301" font-size="14" fill="#1769d2" font-weight="700">DESKTOP</text><text x="90" y="340" font-size="25" fill="#0f172a" font-weight="600">Electron + React</text><text x="90" y="377" font-size="19" fill="#64748b" font-weight="400">Accounts, quotas, settings</text><text x="90" y="405" font-size="19" fill="#64748b" font-weight="400">Tray and notifications</text><rect x="64" y="489" width="330" height="165" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="90" y="524" font-size="14" fill="#1769d2" font-weight="700">OPTIONAL GATEWAY CLIENT</text><text x="90" y="563" font-size="25" fill="#0f172a" font-weight="600">Codex / other client</text><text x="90" y="600" font-size="19" fill="#64748b" font-weight="400">Responses API requests</text><text x="90" y="628" font-size="19" fill="#64748b" font-weight="400">Authenticated local endpoint</text><rect x="534" y="336" width="510" height="245" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="560" y="371" font-size="14" fill="#1769d2" font-weight="700">LOCAL CORE</text><text x="560" y="410" font-size="25" fill="#0f172a" font-weight="600">Node + Fastify</text><text x="560" y="447" font-size="19" fill="#64748b" font-weight="400">OAuth and quota refresh</text><text x="560" y="475" font-size="19" fill="#64748b" font-weight="400">Account pool and retry policy</text><text x="560" y="503" font-size="19" fill="#64748b" font-weight="400">Restart controller and recovery</text><text x="560" y="531" font-size="19" fill="#64748b" font-weight="400">127.0.0.1 loopback listener</text><path d="M 394 349 H 470 V 387 H 534" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="405" y="322" font-size="16" fill="#64748b" font-weight="400">Management</text><path d="M 394 572 H 470 V 520 H 534" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="405" y="601" font-size="16" fill="#64748b" font-weight="400">Optional routing</text><rect x="1180" y="337" width="356" height="216" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="1206" y="372" font-size="14" fill="#1769d2" font-weight="700">UPSTREAM SERVICE</text><text x="1206" y="411" font-size="25" fill="#0f172a" font-weight="600">ChatGPT / Codex</text><text x="1206" y="448" font-size="19" fill="#64748b" font-weight="400">Account sign-in</text><text x="1206" y="476" font-size="19" fill="#64748b" font-weight="400">Quota information</text><text x="1206" y="504" font-size="19" fill="#64748b" font-weight="400">Responses traffic</text><path d="M 1044 445 H 1180" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1072" y="423" font-size="16" fill="#64748b" font-weight="400">HTTPS</text><rect x="534" y="632" width="510" height="140" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="560" y="667" font-size="14" fill="#1769d2" font-weight="700">STORAGE</text><text x="560" y="706" font-size="25" fill="#0f172a" font-weight="600">SQLite account store</text><text x="560" y="743" font-size="19" fill="#64748b" font-weight="400">Encrypted tokens · snapshots · request metadata</text><path d="M 789 581 V 632" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="64" y="846" width="620" height="164" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="90" y="881" font-size="14" fill="#1769d2" font-weight="700">macOS ONLY</text><text x="90" y="920" font-size="25" fill="#0f172a" font-weight="600">Swift / AppKit lifecycle helper</text><text x="90" y="957" font-size="19" fill="#64748b" font-weight="400">Graceful quit, process checks and launch</text><text x="90" y="985" font-size="19" fill="#64748b" font-weight="400">Selected login written to Codex’s auth file</text><rect x="824" y="846" width="712" height="164" rx="20" fill="#ffffff" stroke="#dce3ed"/><text x="850" y="881" font-size="14" fill="#1769d2" font-weight="700">DESKTOP TARGET</text><text x="850" y="920" font-size="25" fill="#0f172a" font-weight="600">Codex application</text><text x="850" y="957" font-size="19" fill="#64748b" font-weight="400">Close, change login and reopen</text><text x="850" y="985" font-size="19" fill="#64748b" font-weight="400">No private desktop RPC connection required</text><path d="M 565 581 H 435 V 846" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M 684 928 H 824" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="64" y="1060" font-size="19" fill="#64748b" font-weight="400">Manager encrypts its stored credentials. Codex auth files and explicit credential exports remain readable.</text></g></svg>
